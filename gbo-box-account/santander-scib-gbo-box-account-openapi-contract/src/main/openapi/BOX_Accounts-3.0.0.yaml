    CreateUpdateAccount:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Account'
      description: Succesful request
    CreateUpdateStandardSettlementInstructions:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardSettlementInstructions'
      description: Successful request
    CreateUpdateSubAccount:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubAccount'
      description: Succesful request
    Forbidden:
      content:
        application/json:
          example:
            errors:
              - code: forbidden
                description: Forbidden
                level: ERROR
                message: Forbidden
          schema:
            $ref: '#/components/schemas/Errors'
      description: Forbidden
    GatewayTimeout:
      content:
        application/json:
          example:
            errors:
              - code: gatewayTimeout
                description: Gateway timeout
                level: ERROR
                message: Gateway timeout
          schema:
            $ref: '#/components/schemas/Errors'
      description: Gateway timeout
    InternalServerError:
      content:
        application/json:
          example:
            errors:
              - code: internalServerError
                description: Internal server error
                level: ERROR
