components:
  parameters:
    Accept-Language:
      description: |-
        Language and country header.

        The value is a 2-letter language code defined in ISO 639-1 alpha-2 followed by a 2-letter country code defined in ISO 3166-1 alpha-2, separated by a hyphen.
      example: en-US
      in: header
      name: accept-language
      required: false
      schema:
        type: string
    Account-Id:
      description: Account Number. It is generated by GBO's pre-commit process and is unique for each Santander Entity.
      in: path
      name: account_id
      required: true
      schema:
        example: '9930000131'
        type: string
    Authorization:
      description: Request header contains the credentials to authenticate a user agent with a server, usually after the server has responded with a 401 Unauthorized status.
      in: header
      name: authorization
      required: true
      schema:
        type: string
    Bank-Id:
      description: Bank ID of the corporate customer whose settlement instructions are to be included in the response. The bank ID matches a global limit code system (GLCS) alias.
      example: AAOZ
      in: query
      name: bank_id
      required: true
      schema:
        type: string
    Center-Id:
      description: Centre ID of the Santander branch that holds the settlement instructions to be included in the response
      example: NY SIS
      in: query
      name: center_id
      required: true
      schema:
        type: string
    Currency-Code:
      description: Currency code for the settlement instructions to be included in the response
      example: USD
      in: query
      name: currency_code
      required: true
      schema:
        type: string
    Entity-Query:
      description: Entity that owns the account.
      in: query
      name: entity_id
      required: true
      schema:
        example: YIG8
        type: string
    If-Match:
      description: Used for resource modification requests, this field allows you to make changes only if another client has not made any other changes during execution, that is, if the Etag sent is the same.
      in: header
      name: if-match
      required: false
      schema:
        type: string
    If-None-Match:
      description: Gets the GET resources in cache as long as the data of the Etag sent in this header has not changed.
      in: header
      name: if-none-match
      required: false
      schema:
        type: string
    Is-Default:
      description: Whether only default settlement instructions are to be included in the response
      example: true
      in: query
      name: is_default
      required: true
      schema:
        type: boolean
    Operation-Code:
      description: Code for the direction that the settlement instructions to be included in the response accept for their operation flows
      example: PAY
      in: query
      name: operation_code
      required: true
      schema:
        enum:
          - PAY
          - RECEIVE
        type: string
    Operation-Date:
      description: |-
        Operation date of the settlement instructions to be included in the response.

        The value uses the complete data format defined in ISO 8601:

        'YYYY-MM-DD'

        Where:
        - YYYY: 4-digit year
        - MM: 2-digit month (for example, 01 = January)
        - DD: 2-digit day of the month (01 through 31)
      example: '2024-07-30'
      in: query
      name: operation_date
      required: true
      schema:
        type: string
    Party-Id:
      description: ID of the corporate customer whose settlement instructions are to be included in the response. The ID matches a global limit code system (GLCS) alias.
      example: 1SXX
      in: query
      name: party_id
      required: true
      schema:
        type: string
    Related-Entity-Query:
      description: Related Entity. An entity that is associated with the Sub-Account.
      in: query
      name: related_entity
      required: true
      schema:
        example: 6FSY
        type: string
    Santander-Entity:
      description: Santander Bank Entity (Booking Unit) where the Entity is registered. This is used to route the creation.
      in: header
      name: santander-entity
      required: true
      schema:
        example: S0ZI
        type: string
    Standard-Settlement-Instructions-Id:
      description: Unique identifier of a BOX Standard Settlement Instruction for a given Santander Entity.
      in: path
      name: standard_settlement_instructions_id
      required: true
      schema:
        example: '1234.44'
        type: string
    Sub-Account-Id:
      description: Sub-Account Number. It is generated by GBO's pre-commit process and is unique for each Santander Entity.
      in: path
      name: sub_account_id
      required: true
      schema:
        example: '3000232497'
        type: string
    X-B3-ParentSpanId:
      description: The X-B3-ParentSpanId header may be present on a child span and must be absent on the root span. It is encoded as 16 lower-hex characters.
      in: header
      name: x-b3-parentspanid
      required: false
      schema:
        type: string
    X-B3-Sampled:
      description: 'An accept sampling decision is encoded as X-B3-Sampled: 1 and a deny as X-B3-Sampled: 0. Absent means defer the decision to the receiver of this header.'
      in: header
      name: x-b3-sampled
      required: false
      schema:
        type: string
    X-B3-SpanId:
      description: The X-B3-SpanId header is encoded as 16 lower-hex characters.
      in: header
      name: x-b3-spanid
      required: false
      schema:
        type: string
    X-B3-TraceId:
      description: The X-B3-TraceId header is encoded as 32 or 16 lower-hex characters.
      in: header
      name: x-b3-traceid
      required: false
      schema:
        type: string
    X-Santander-Client-Id:
      description: Client ID header
      example: 2a1fcc83-0ca7-45c4-a0f9-e0e0c96565f0
      in: header
      name: x-santander-client-id
      required: true
      schema:
        type: string
    X-Santander-Device:
      description: Device information allowed by the operation for data query. Allows to apply base experience to optimize the response according to the device that requests it.
      in: header
      name: x-santander-device
      required: false
      schema:
        type: string
  requestBodies:
    CreateUpdateAccount:
      content:
        application/json:
          schema:
