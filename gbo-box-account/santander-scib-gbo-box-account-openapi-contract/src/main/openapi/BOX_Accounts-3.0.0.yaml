          schema:
            $ref: '#/components/schemas/Errors'
      description: Internal server error
    NoContent:
      description: No content
    NotAcceptable:
      content:
        application/json:
          example:
            errors:
              - code: notAcceptable
                description: Not acceptable
                level: ERROR
                message: Not acceptable
          schema:
            $ref: '#/components/schemas/Errors'
      description: Not acceptable
    NotFound:
      content:
        application/json:
          example:
            errors:
              - code: notFound
                description: Not found
                level: ERROR
                message: Not found
