openapi: 3.0.3
info:
  contact:
    email: francisco.gonzalezhernandez@gruposantander.com
    name: Francisco Javier Gonzalez Hernandez
    url: https://internal-apimarket.scib.gs.corp/scib/internal/contactus
  description: The API will be used by all the systems in different markets to enrich Back Office Express (BOX) Security Accounts data model in the onboarding process of clients that want to start doing business with Santander, meaning that the API will be called to insert details of the accounts, sub accounts and settlement instructions. It will be used to create and update data during the ongoing process. Also, it will be possible to retrieve information from BOX Accounts, so other systems can use the information that is stored in it. This API was initially thought to industrialize the process of manual insertion by users.
  license:
    name: Santander CIB API License
    url: https://internal-apimarket.scib.gs.corp/scib/internal/terms
  termsOfService: https://internal-apimarket.scib.gs.corp/scib/internal/terms
  title: BOX Accounts
  version: 3.0.0
  x-api-governance:
