          schema:
            $ref: '#/components/schemas/Errors'
      description: Unsupported media type
  schemas:
    Account:
      description: Data structure containing BOX Account information
      properties:
        accountId:
          description: Unique account ID. Account Number. It is generated by GBO's pre-commit process and is unique for each Santander Entity.
          example: '9930000131'
          readOnly: true
          type: string
        accountIdentification:
          $ref: '#/components/schemas/AccountIdentification'
        alertAcronyms:
          $ref: '#/components/schemas/AlertAcronyms'
        authorizedAssetClasses:
          description: Array of Authorized Asset Classes.
          example:
            - code: FI
              description: Fixed Income
            - code: EQ
              description: Equity
          items:
            description: Data structure containing information about the Asset Class.
            minProperties: 1
            properties:
              code:
                description: Asset Class Code
                example: EQ
                type: string
              description:
                description: Asset Class Description
                example: Equity
                type: string
            type: object
          type: array
        authorizedAssetLevel:
          description: Indicates the Authorized Asset level that can be used in operations that use the account. For example, if this is set to 'Families', the client can then specify which families of asset classes the account is able to trade, e.g. 'Fixed Income', 'Equity', 'Money Market', etc. If it was set to 'Instruments', the authorized asset classes would be 'Caps and Floors', 'Credit Derivatives', etc. Allowed values are 'Families', 'Products', 'Instruments'.
          example: Families
          type: string
        identifiers:
          description: Array of identifiers. Used to share synonymous information within an account
          items:
            $ref: '#/components/schemas/WrapperAccountSubAccountIdentifier'
          type: array
        isAllowSubAccounts:
          description: Whether the account is allowed to have sub-accounts associated.
          example: true
          type: boolean
        isInternalAccount:
          description: Whether the account is Internal.
          example: false
          type: boolean
        isPropTrading:
          description: Whether the entity is an intermediary (Non-Customer) or a direct Client (Customer).
          example: false
          type: boolean
        isStatementsOptOut:
          description: Whether the client opted out of receiving statements for this account.
          example: false
          type: boolean
        parties:
          description: Array of parties associated with the account.
          example:
            - party:
                partyId: 1SXX
                type:
                  code: Santander Entity
            - party:
                partyId: 1SDA
                type:
                  code: Entity
            - party:
                partyId: NY SIS
                type:
                  code: Branch
          items:
            description: Data structure containing party details. A party is an entity that is involved in an activity.
            minProperties: 1
            properties:
              party:
                $ref: '#/components/schemas/Party'
            type: object
          type: array
        sourceApplication:
          description: Data structure containing information about a source application.
          properties:
            code:
              description: Source system code.
              example: TIARA
              type: string
            name:
              description: Source system name.
              example: Tiara
              readOnly: true
              type: string
          required:
            - code
          type: object
        statusInfo:
          $ref: '#/components/schemas/StatusInfo'
      required:
        - accountIdentification
        - statusInfo
        - parties
        - isStatementsOptOut
        - isInternalAccount
        - isPropTrading
      type: object
    AccountIdentification:
      description: Data structure containing information related to account identification
      properties:
        displayName:
          description: Displayed account name
          example: VAN ECK ASSOCIATES CORPORATION
          type: string
        nickName:
          description: Account nickname. Also known as mnemonic.
          example: VANECK
          type: string
      required:
        - displayName
        - nickName
      type: object
    AccountingMovement:
      description: Data structure containing the information required for an accounting movement. Applies only if the functional specification indicates that a request must be sent to the 'Inter Applications' subsystem. This subsystem is a single system that is responsible for controlling bridge accounts between Santander applications.
      properties:
        account:
          description: Data structure containing account information
          minProperties: 1
          properties:
            accountId:
              description: Unique account ID
              example: '12345678'
              type: string
            typeDescription:
              description: Account type description
              example: Cash account
              type: string
          type: object
        accountingMovementDetail:
          $ref: '#/components/schemas/AccountingMovementDetail'
        accountingMovementId:
          description: Unique accounting movement ID
          example: '0'
          type: string
        keptSignalIndicator:
          description: Whether the operation signal is kept
          example: true
          type: boolean
        settlementAdjustment:
          $ref: '#/components/schemas/SettlementAdjustment'
      required:
        - accountingMovementId
      type: object
    AccountingMovementDetail:
      description: Data structure containing information about an accounting movement detail
      properties:
        contract:
          $ref: '#/components/schemas/Contract'
        description1:
          description: Line 1 of the accounting movement detail
          example: VEGAXXXXX
          maxLength: 125
          type: string
      required:
        - contract
      type: object
    AlertAcronyms:
      description: Data structure containing information related to DTCC Alert application. Alert application is an online global database for the maintenance and communication of accounts and SSIs.
      minProperties: 1
      properties:
        acronyms:
          description: Array of client identification codes in Alert application.
          items:
            description: Alert identification code.
            example: VANECK
            type: string
          type: array
        isAlertConfig:
          description: Whether the Account is being synchronized with DTCC Alert application.
          example: true
          type: boolean
      type: object
    AlertConfig:
      description: Array containing the sub-account's Alert acronyms and access codes used to retrieve Settlement instructions for each family.
      example:
        - accessCode: VANECK-FI
          acronym: VANECK
          family: Fixed Income
        - accessCode: VANECK-EQ
          acronym: VANECK
          family: Equity
      items:
        description: Data structure containing the Alert acronyms and access codes used to retrieve Settlement instructions for each family.
        minProperties: 1
        properties:
          accessCode:
            description: Code used to identify a set of settlement instructions for a client.
            example: VANECK-EQ
            type: string
          acronym:
            description: Client identification code in Alert application.
            example: VANECK
            type: string
          family:
            description: Family for the settlement instructions represent by the asociated Acronym and Access code
            example: Equity
            type: string
        type: object
      type: array
    AlertData:
      description: Data structure containing information related to DTCC Alert application. Alert application is an online global database for the maintenance and communication of accounts and SSIs.
      minProperties: 1
      properties:
        alertConfig:
          $ref: '#/components/schemas/AlertConfig'
        isAlertConfig:
          description: Wheter the Sub-Account is being synchronized with DTCC Alert application.
          example: true
          type: boolean
      type: object
    Amount:
      description: Data structure containing amount details
      minProperties: 1
      properties:
        amount:
          description: |-
            Amount.

            The value uses the data format defined in ISO 20022 and has a maximum of 18 digits, of which 5 can be decimals, separated by a point.
          example: 99.99
          type: number
      type: object
    Bank:
      description: Data structure containing bank details
      properties:
        bankId:
          description: Unique bank ID
          example: AAOZ
          type: string
        bic:
          description: Bank identifier code (BIC)
          example: MSSACHZXFXO
          type: string
        center:
          $ref: '#/components/schemas/Center'
      required:
        - bic
      type: object
    CashFlow:
      description: Data structure containing information about a cash flow
      properties:
        operationTypeDescription:
          description: Operation type description
          example: Interest
          type: string
      required:
        - operationTypeDescription
      type: object
    Center:
      description: Data structure containing information about a bank centre
      properties:
        type:
          description: Bank centre type
          example: NY SIS
          type: string
      required:
        - type
      type: object
    Component:
      description: Data structure containing the status components.
      properties:
        name:
          description: Name of the component.
          example: Oracle
          type: string
        status:
          $ref: '#/components/schemas/Status'
        type:
          description: Description of the component.
          example: Database
          type: string
      required:
        - name
        - type
        - status
      type: object
    ContactPoint:
      description: Data structure containing information about a contact point. A contact point is a phone number, physical address, or virtual address used for communication purposes.
      properties:
        phoneAddress:
          $ref: '#/components/schemas/PhoneAddress'
      required:
        - phoneAddress
      type: object
    Contract:
      description: Data structure containing contract information
      properties:
        bank:
          $ref: '#/components/schemas/Bank'
      required:
        - bank
      type: object
    Currency:
      description: Data structure containing currency details
      properties:
        code:
          description: |-
            Currency code.

            The value is in the alpha-3 format defined in ISO 4217 (https://www.iso.org/iso-4217-currency-codes.html).
          example: USD
          maxLength: 3
          type: string
      required:
        - code
      type: object
    Error:
      description: Data structure containing the error details
      properties:
        code:
          description: Unique alphanumeric human readable error code
          example: badRequest
          type: string
        description:
          description: Detailed description of the reported issue
          example: Information about the returned error, used to resolve it
          type: string
        level:
          description: Level of the reported issue
          enum:
            - ERROR
            - FATAL
            - INFO
            - WARNING
          example: ERROR
          type: string
        message:
          description: Brief summary of the reported issue
          example: Message
          type: string
      required:
        - code
        - message
      type: object
    Errors:
      description: Data structure containing the details for errors
      properties:
        errors:
          description: Array of errors
          items:
            $ref: '#/components/schemas/Error'
          type: array
      required:
        - errors
      type: object
    Health:
      description: Data structure containing information about the health response.
      properties:
        components:
          description: List of components.
          items:
            $ref: '#/components/schemas/Component'
          type: array
        status:
          $ref: '#/components/schemas/Status'
      required:
        - status
        - components
      type: object
    Party:
      description: Data structure containing party details. A party is an entity that is involved in an activity.
      properties:
        bank:
          $ref: '#/components/schemas/Bank'
        contactPoint:
          $ref: '#/components/schemas/ContactPoint'
        identifiers:
          description: Array of identifiers. Used to share synonymous information within a party
          items:
            $ref: '#/components/schemas/WrapperPartyIdentifier'
          type: array
        partyId:
          description: Unique party ID
          example: 1SXX
          type: string
        person:
          $ref: '#/components/schemas/Person'
        type:
          $ref: '#/components/schemas/PartyType'
      required:
        - type
        - partyId
      type: object
    PartyType:
      description: Data structure containing party type details. A party is an entity that is involved in an activity.
      properties:
        code:
          description: Party type code
          example: counterparty
          type: string
      required:
        - code
      type: object
    Period:
      description: Data structure containing period information
      properties:
        endDate:
          description: |-
            Date when the period ends.

            The value uses the complete data format defined in ISO 8601:

            'YYYY-MM-DD'

            Where:
            - YYYY: 4-digit year
            - MM: 2-digit month (for example, 01 = January)
            - DD: 2-digit day of the month (01 through 31)
          example: '2025-05-21'
          format: date
          type: string
        startDate:
          description: |-
            Date when the period starts.

            The value uses the complete data format defined in ISO 8601:

            'YYYY-MM-DD'

            Where:
            - YYYY: 4-digit year
            - MM: 2-digit month (for example, 01 = January)
            - DD: 2-digit day of the month (01 through 31)
          example: '2025-05-20'
          format: date
          type: string
      required:
        - startDate
      type: object
    Person:
      description: Data structure containing information about a natural person
      properties:
        personName:
          $ref: '#/components/schemas/PersonName'
      required:
        - personName
      type: object
    PersonName:
      description: Data structure containing information about a person's name. The information included in the data structure relates to the name by which the person is known and that is commonly used to identify the person.
      properties:
        fullName:
          description: Person's full name
          example: John Doe
          type: string
        nickName:
          description: |-
            Person's nickname.

            The value can be alphanumeric and can include periods, commas, spaces, dashes, single quotes, and apostrophes.
          example: John.clark1978
          type: string
      required:
        - fullName
      type: object
    PhoneAddress:
      description: Data structure containing information that identifies a phone address
      properties:
        phoneNumber:
          description: Phone number, as defined by a telecom service
          example: '123456789'
          maxLength: 35
          minLength: 2
          type: string
      required:
        - phoneNumber
      type: object
    Product:
      description: Data structure containing product information. Products can be services or goods.
      properties:
        family:
          description: Data structure containing the commercial classification of the product
          minProperties: 1
          properties:
            productFamily:
              $ref: '#/components/schemas/ProductFamily'
          type: object
        name:
          description: Product name
          example: CASH
          maxLength: 50
          type: string
        subproduct:
          $ref: '#/components/schemas/Subproduct'
        typeCode:
          description: Product type code
          example: Bonds
          type: string
      required:
        - family
      type: object
    ProductFamily:
      description: Data structure containing details about the family to which a product belongs. A product can belong only to a single family.
      properties:
        name:
          description: Product family name
          example: EQ
          type: string
      required:
        - name
      type: object
    SettlementAdjustment:
      description: Data structure containing information about a settlement adjustment
      properties:
        daysToSettlement:
          $ref: '#/components/schemas/Term'
      required:
        - daysToSettlement
      type: object
    StandardSettlementInstructions:
      description: Data structure containing specific information about standard settlement instructions. The instructions are used for cash or securities.
      properties:
        accountingMovements:
          description: Array of accounting movements for the settlement instructions
          items:
            $ref: '#/components/schemas/AccountingMovement'
          type: array
        currency:
          $ref: '#/components/schemas/Currency'
        isActive:
          description: Whether the standard settlement instructions are active
          example: true
          type: boolean
        isDefault:
          description: Whether the standard settlement instructions are the default instructions
          example: true
          type: boolean
        maximumAmount:
          $ref: '#/components/schemas/Amount'
        method:
          description: Data structure containing information about a settlement method to which the settlement instructions correspond
          minProperties: 1
          properties:
            cashFlow:
              $ref: '#/components/schemas/CashFlow'
            directMethodType:
              description: Direct settlement method type
              example: INTERMEDIARY_ACCOUNT
              type: string
            methodType:
              description: Settlement method type
              example: DIRECT_METHOD
              type: string
            paymentSystem:
              description: Data structure containing information about the payment system to which the settlement instructions correspond
              minProperties: 1
              properties:
                typeCode:
                  description: The code of the payment system to which the settlement instructions correspond
                  example: SWIFT
                  type: string
                typeDescription:
                  description: The description of the payment system to which the settlement instructions correspond
                  example: SWIFT Payments
                  type: string
              type: object
          type: object
        minimumAmount:
          $ref: '#/components/schemas/Amount'
        operationCode:
          description: Code for the direction that the standard settlement instructions accept for their operation flows
          enum:
            - PAY
            - RECEIVE
            - BOTH
          example: PAY
          type: string
        period:
          $ref: '#/components/schemas/Period'
        priority:
          description: |-
            Priority order of the standard settlement instructions when multiple instructions with the same criteria exist within the same account or sub-account.

            The lowest value represents the highest priority.
          example: '50'
          type: string
        product:
          $ref: '#/components/schemas/Product'
        purpose:
          description: Purpose of the settlement to which the instructions are applied
          example: Interest bonds
          type: string
        settlementParties:
          description: Array of parties related to the instruction settlement
          items:
            description: Data structure containing information about a counterparty
            minProperties: 1
            properties:
              accounts:
                description: Array of accounts
                items:
                  description: Data structure containing BOX Account information
                  minProperties: 1
                  properties:
                    accountId:
                      description: Unique account Id
                      example: '12345678'
                      type: string
                    typeDescription:
                      description: Account Type description
                      example: Cash account
                      type: string
                  type: object
                type: array
              party:
                $ref: '#/components/schemas/Party'
              specialInstructions:
                description: Data structure containing information about special instructions for third parties related to the settlement instructions
                properties:
                  detail:
                    description: Details of the special instructions for third parties
                    example: Josipa Broza TiTa 57 S.W.I.F.T. HBBAMEPGAXXX.
                    type: string
                  specialInstructionsId:
                    description: ID for the special instructions for third parties
                    example: '1'
                    type: string
                required:
                  - specialInstructionsId
                  - detail
                type: object
            type: object
          type: array
        sourceSystem:
          $ref: '#/components/schemas/System'
        standardSettlementInstructionsId:
          description: Unique ID for the standard settlement instructions
          example: '111.22'
          readOnly: true
          type: string
        standardSettlementInstructionsParent:
          description: Data structure containing the parent of the Standard Settlement Instruction.
          minProperties: 1
          properties:
            id:
              description: Id of the parent
              example: '3000232497'
              type: string
            type:
              description: Type of the parent.
              enum:
                - ACCOUNT
                - SUBACCOUNT
                - CENTER
              example: SUBACCOUNT
              type: string
          type: object
        typeCode:
          description: Code for the standard settlement instruction type
          enum:
            - CASH
            - SECURITIES
            - SECURITIES_AGAINST_PAYMENT
            - SECURITIES_FREE_PAYMENT
          example: CASH
          type: string
      required:
        - standardSettlementInstructionsId
        - isDefault
        - settlementParties
        - period
        - operationCode
        - currency
        - standardSettlementInstructionsParent
      type: object
    Status:
      description: |-
        Status of the component.
        - UP: Status indicating that the component or subsystem is functioning as expected.
        - DOWN: Status indicating that the component or subsystem has suffered an unexpected failure.
        - OUT_OF_SERVICE: Status indicating that the component or subsystem has been taken out of service and should not be used.
        - UNKNOWN: Status indicating that the component or subsystem is in an unknown state.
      enum:
        - UP
        - DOWN
        - UNKNOWN
        - OUT_OF_SERVICE
      example: UP
      type: string
    StatusInfo:
      description: Data structure containing information about an item's status
      properties:
        statusCode:
          description: Status code
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE
          type: string
      required:
        - statusCode
      type: object
    SubAccount:
      description: Data structure containing BOX Sub-Account details.
      properties:
        accountId:
          description: Unique account ID. It is generated by GBO's pre-commit process.
          example: '9930000131'
          type: string
        alertData:
          $ref: '#/components/schemas/AlertData'
        authorizedAssetClasses:
          description: Array of Authorized Asset Classes.
          example:
            - code: FI
              description: Fixed Income
            - code: EQ
              description: Equity
          items:
            description: Data structure containing information about the Asset Class.
            minProperties: 1
            properties:
              code:
                description: Asset Class Code
                example: EQ
                type: string
              description:
                description: Asset Class Description
                example: Equity
                type: string
            type: object
          type: array
        authorizedAssetLevel:
          description: Indicates the Authorized Asset level that can be used in operations that use the account. For example, if this is set to 'Families', the client can then specify which families of asset classes the account is able to trade, e.g. 'Fixed Income', 'Equity', 'Money Market', etc. If it was set to 'Instruments', the authorized asset classes would be 'Caps and Floors', 'Credit Derivatives', etc.
          example: Families
          type: string
        identifiers:
          description: Array of identifiers. Used to share synonymous information within a  sub account
          items:
            $ref: '#/components/schemas/WrapperAccountSubAccountIdentifier'
          type: array
        isStatementsOptOut:
          description: Whether the client opted out of receiving statements for this account.
          example: false
          type: boolean
        parties:
          description: Array of parties associated with the account.
          example:
            - party:
                partyId: 1SXX
                type:
                  code: Santander Entity
            - party:
                partyId: ABCD
                type:
                  code: Related Entity
            - party:
                partyId: NY SIS
                type:
                  code: Branch
          items:
            description: Data structure containing party details. A party is an entity that is involved in an activity.
            minProperties: 1
            properties:
              party:
                $ref: '#/components/schemas/Party'
            type: object
          type: array
        sourceApplication:
          description: Data structure containing information about a source application.
          properties:
            code:
              description: Source system code.
              example: TIARA
              type: string
            name:
              description: Source system name.
              example: Tiara
              readOnly: true
              type: string
          required:
            - code
          type: object
        statusInfo:
          $ref: '#/components/schemas/StatusInfo'
        subAccountId:
          description: Unique Sub-Account Id. Sub-Account Number. It is generated by GBO's pre-commit process and is unique for each Santander Entity.
          example: '3000232497'
          readOnly: true
          type: string
        subAccountIdentification:
          $ref: '#/components/schemas/SubAccountIdentification'
        subAccountType:
          description: Identification of the type of the sub-account
          example: 9 Deliver vs. Payment/ Receive vs. Payment
          type: string
      required:
        - subAccountIdentification
        - statusInfo
        - subAccountType
        - isStatementsOptOut
        - accountId
      type: object
    SubAccountIdentification:
      description: Data structure containing information related to sub-account identification
      properties:
        displayName:
          description: Displayed sub-account name
          example: VAN ECK ASSOCIATES CORPORATION SUBACCOUNT
          type: string
        nickName:
          description: Sub-account nickname. Also known as mnemonic.
          example: VANECKSUB
          type: string
      required:
        - displayName
        - nickName
      type: object
    Subproduct:
      description: Data structure containing subproduct details
      properties:
        name:
          description: Subproduct name
          example: Bonds
          maxLength: 50
          type: string
      required:
        - name
      type: object
    System:
      description: Data structure containing information about a system used to store data
      properties:
        code:
          description: System code
          example: ALERT
          type: string
      required:
        - code
      type: object
    Term:
      description: Data structure containing information about a fixed period
      minProperties: 1
      properties:
        days:
          description: Number of days
          example: 2
          type: number
      type: object
    WrapperAccountSubAccountIdentifier:
      description: Data structure containing information about an identifier
      minProperties: 1
      properties:
        code:
          description: Identifier code
          enum:
            - OUTPUT_ALIAS
            - INPUT_ALIAS
            - UNIQUE_ALIAS
            - PARAMETER
          example: OUTPUT_ALIAS
          type: string
        description:
          description: Identifier description
          example: GOLD TIER SIS
          type: string
        value:
          description: Identifier value
          example: '123456'
          type: string
      type: object
      x-bizObjRef: Identifier
    WrapperAccounts:
      description: Array of accounts belonging to an Entity.
      items:
        $ref: '#/components/schemas/Account'
      type: array
    WrapperPartyIdentifier:
      description: Data structure containing information about an identifier
      minProperties: 2
      properties:
        description:
          description: Identifier description
          example: InternalId
          type: string
        value:
          description: Identifier value
          example: '-123456789'
          type: string
      type: object
      x-bizObjRef: Identifier
    WrapperStandardSettlementInstructions:
      description: List of settlement instructions.
      items:
        $ref: '#/components/schemas/StandardSettlementInstructions'
      minItems: 1
      type: array
    WrapperSubAccounts:
      description: Array of sub accounts associated with a Related Entity.
      items:
        $ref: '#/components/schemas/SubAccount'
      type: array
